<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Security Hub{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="bar">
    <a class="brand" href="{{ url_for('index') }}">Security Hub</a>
    <nav>
      <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>New scan</a>
      <a href="{{ url_for('scan_list') }}" {% if request.endpoint == 'scan_list' %}aria-current="page"{% endif %}>Scan history</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
